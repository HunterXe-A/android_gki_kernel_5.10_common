name: Build bq_ra_reader.ko

on:
  push:
    branches: [android12-5.10-2025-09]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64
  SUBARCH: arm64
  LLVM: "1"
  LLVM_IAS: "1"
  CROSS_COMPILE: aarch64-linux-android-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KBUILD_OUTPUT: out
  LOCALVERSION: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: 确认 x86_64 交叉编译主机
        run: |
          test "$(uname -m)" = "x86_64"
          echo "GitHub Actions host: $(uname -m)"
          echo "Kernel target: ${ARCH}"

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache flex gcc-aarch64-linux-gnu \
            libelf-dev libncurses-dev libssl-dev kmod python3 rsync \
            unzip

      - name: 下载 Android NDK r28
        run: |
          URL="https://dl.google.com/android/repository/android-ndk-r28-linux.zip"
          curl -fL --retry 3 -o ndk.zip "$URL"
          unzip -q ndk.zip
          rm -f ndk.zip
          mv android-ndk-r28 ndk
          NDK_BIN="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_BIN" >> "$GITHUB_PATH"
          echo "=== clang version ==="
          "$NDK_BIN/clang" --version | head -3
          echo "=== llvm-readelf version ==="
          "$NDK_BIN/llvm-readelf" --version | head -1

      - name: Configure kernel
        run: |
          : > .scmversion
          test -f .scmversion
          make O="$KBUILD_OUTPUT" \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            gki_defconfig
          # I2C_SMBUS must be built in so bq_ra_reader (depends on
          # I2C && I2C_SMBUS && SYSFS) survives olddefconfig.
          printf '%s\n' 'CONFIG_I2C_SMBUS=y' >> "$KBUILD_OUTPUT/.config"
          printf '%s\n' 'CONFIG_BQ_RA_READER=m' >> "$KBUILD_OUTPUT/.config"
          sed -i \
            -e '/^CONFIG_LOCALVERSION_AUTO=/d' \
            -e '/^# CONFIG_LOCALVERSION_AUTO is not set$/d' \
            "$KBUILD_OUTPUT/.config"
          printf '%s\n' '# CONFIG_LOCALVERSION_AUTO is not set' \
            >> "$KBUILD_OUTPUT/.config"
          make O="$KBUILD_OUTPUT" \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            olddefconfig
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' "$KBUILD_OUTPUT/.config"
          KERNEL_RELEASE="$(make --no-print-directory O="$KBUILD_OUTPUT" kernelrelease)"
          printf 'target kernelrelease=%s\n' "$KERNEL_RELEASE"
          test "$KERNEL_RELEASE" = "5.10.240-ztc1997"
          grep -q '^CONFIG_MODULES=y$' "$KBUILD_OUTPUT/.config"
          grep -q '^CONFIG_LTO_CLANG_FULL=y$' "$KBUILD_OUTPUT/.config"
          ! grep -q '^CONFIG_LTO_CLANG_THIN=y$' "$KBUILD_OUTPUT/.config"
          grep -q '^CONFIG_MODVERSIONS=y$' "$KBUILD_OUTPUT/.config"
          grep -q '^CONFIG_CFI_CLANG=y$' "$KBUILD_OUTPUT/.config"
          grep -q '^CONFIG_I2C_SMBUS=y$' "$KBUILD_OUTPUT/.config"
          grep -q '^CONFIG_BQ_RA_READER=m$' "$KBUILD_OUTPUT/.config"

      - name: Build kernel symbol table with ThinLTO
        run: |
          SYMVERS_OUTPUT=out-symvers
          make O="$SYMVERS_OUTPUT" \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            gki_defconfig
          sed -i \
            -e '/^CONFIG_LOCALVERSION_AUTO=/d' \
            -e '/^# CONFIG_LOCALVERSION_AUTO is not set$/d' \
            -e 's/^CONFIG_LTO_CLANG_FULL=y$/# CONFIG_LTO_CLANG_FULL is not set/' \
            -e 's/^# CONFIG_LTO_CLANG_THIN is not set$/CONFIG_LTO_CLANG_THIN=y/' \
            "$SYMVERS_OUTPUT/.config"
          printf '%s\n' '# CONFIG_LOCALVERSION_AUTO is not set' \
            >> "$SYMVERS_OUTPUT/.config"
          grep -q '^# CONFIG_LTO_CLANG_FULL is not set$' "$SYMVERS_OUTPUT/.config"
          grep -q '^CONFIG_LTO_CLANG_THIN=y$' "$SYMVERS_OUTPUT/.config"
          make O="$SYMVERS_OUTPUT" \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            olddefconfig
          grep -q '^# CONFIG_LOCALVERSION_AUTO is not set$' "$SYMVERS_OUTPUT/.config"
          KERNEL_RELEASE="$(make --no-print-directory O="$SYMVERS_OUTPUT" kernelrelease)"
          printf 'symvers kernelrelease=%s\n' "$KERNEL_RELEASE"
          test "$KERNEL_RELEASE" = "5.10.240-ztc1997"
          grep -q '^CONFIG_MODULES=y$' "$SYMVERS_OUTPUT/.config"
          grep -q '^CONFIG_MODVERSIONS=y$' "$SYMVERS_OUTPUT/.config"
          grep -q '^CONFIG_CFI_CLANG=y$' "$SYMVERS_OUTPUT/.config"
          grep -q '^CONFIG_LTO_CLANG_THIN=y$' "$SYMVERS_OUTPUT/.config"
          make O="$SYMVERS_OUTPUT" \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            vmlinux -j"$(nproc)"
          test -s "$SYMVERS_OUTPUT/vmlinux"
          test -s "$SYMVERS_OUTPUT/vmlinux.symvers"
          test -s "$SYMVERS_OUTPUT/System.map"
          grep -q '[[:space:]]module_layout[[:space:]]' "$SYMVERS_OUTPUT/vmlinux.symvers"

      - name: Build bq_ra_reader module
        run: |
          make O="$KBUILD_OUTPUT" \
            KBUILD_MIXED_TREE="$GITHUB_WORKSPACE/out-symvers" \
            CC="ccache clang" \
            HOSTCC="ccache clang" \
            drivers/misc/bq_ra_reader/bq_ra_reader.ko \
            -j"$(nproc)"
          test -s "$KBUILD_OUTPUT/drivers/misc/bq_ra_reader/bq_ra_reader.ko"
          test -s "$KBUILD_OUTPUT/modules-only.symvers"
          cp "$GITHUB_WORKSPACE/out-symvers/vmlinux.symvers" \
            "$KBUILD_OUTPUT/vmlinux.symvers"
          cat "$KBUILD_OUTPUT/vmlinux.symvers" \
            "$KBUILD_OUTPUT/modules-only.symvers" > "$KBUILD_OUTPUT/Module.symvers"
          test -s "$KBUILD_OUTPUT/Module.symvers"

      - name: Verify bq_ra_reader ABI and metadata
        env:
          RA: out/drivers/misc/bq_ra_reader/bq_ra_reader.ko
        run: |
          set -euo pipefail

          KERNEL_RELEASE="$(cat out/include/config/kernel.release)"

          llvm-readelf -h "$RA" > ra.header.txt
          grep -q 'Class:.*ELF64' ra.header.txt
          grep -q 'Machine:.*AArch64' ra.header.txt

          llvm-readelf -p .modinfo "$RA" > ra.modinfo.txt
          grep -q 'name=bq_ra_reader' ra.modinfo.txt
          grep -Fq "vermagic=$KERNEL_RELEASE " ra.modinfo.txt

          llvm-readelf -SW "$RA" > ra.sections.txt
          RA_VERSIONS_LINE="$(awk '$2 == "__versions" {print; exit}' ra.sections.txt)"
          test -n "$RA_VERSIONS_LINE"
          RA_VERSIONS_SIZE="$(printf '%s\n' "$RA_VERSIONS_LINE" | awk '{print $(NF-5)}')"
          test "$RA_VERSIONS_SIZE" != "000000"
          llvm-readelf -p __versions "$RA" > ra.versions.txt
          grep -q 'module_layout' ra.versions.txt
          grep -q '__i2c_smbus_xfer' ra.versions.txt
          grep -q 'i2c_for_each_dev' ra.versions.txt
          grep -q 'i2c_verify_client' ra.versions.txt

          llvm-nm -a "$RA" > ra.nm.txt
          grep -q '[[:space:]]__cfi_check$' ra.nm.txt
          grep -q '[[:space:]]__cfi_jt_start$' ra.nm.txt
          grep -q '[[:space:]]__cfi_jt_end$' ra.nm.txt
          ! grep -q '[[:space:]]bms_get_batt_sn$' ra.nm.txt
          ! grep -q '[[:space:]]bms_get_property$' ra.nm.txt
          ! grep -q '[[:space:]]bms_set_property$' ra.nm.txt

          echo 'ABI checks passed for bq_ra_reader.ko.'
          sha256sum "$RA"

      - name: Upload bq_ra_reader module
        uses: actions/upload-artifact@v4
        with:
          name: bq_ra_reader-xaga
          if-no-files-found: error
          path: |
            out/drivers/misc/bq_ra_reader/bq_ra_reader.ko
            out/Module.symvers
            out/vmlinux.symvers
            out/modules-only.symvers
            out/include/config/kernel.release
            out/.config
            out-symvers/vmlinux.symvers
            out-symvers/System.map
            out-symvers/.config
            ra.header.txt
            ra.modinfo.txt
            ra.sections.txt
            ra.versions.txt
            ra.nm.txt