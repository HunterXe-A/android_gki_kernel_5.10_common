name: Build bq28z610.ko

on:
  push:
    branches: [android12-5.10-2025-09]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker system prune -af || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc bison flex libelf-dev libssl-dev \
            libncurses-dev build-essential ccache python3 kmod

      - name: 下载 Android NDK r28
        run: |
          URL="https://dl.google.com/android/repository/android-ndk-r28-linux.zip"
          echo "下载: $URL"
          curl -fL --retry 3 -o ndk.zip "$URL"
          unzip -q ndk.zip
          rm -f ndk.zip
          mv android-ndk-r28 ndk
          NDK_CLANG="${{ github.workspace }}/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$NDK_CLANG" >> "$GITHUB_PATH"
          echo "NDK 大小:"
          du -sh ndk
          echo ""
          echo "=== clang version ==="
          "$NDK_CLANG/clang" --version 2>&1 | head -3

      - name: Configure kernel
        run: |
          make ARCH=arm64 \
            SUBARCH=arm64 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            gki_defconfig

      - name: Prepare modules build
        run: |
          make ARCH=arm64 \
            SUBARCH=arm64 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            modules_prepare -j$(nproc)

      - name: Build hwid module (for CRC)
        run: |
          make ARCH=arm64 \
            SUBARCH=arm64 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            M=drivers/misc/hwid \
            modules -j$(nproc)

      - name: Build bq28z610 module
        run: |
          make ARCH=arm64 \
            SUBARCH=arm64 \
            CC="ccache clang" \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1 \
            M=drivers/power/supply \
            modules -j$(nproc)

      - name: Verify modules
        run: |
          echo "=== clang version ==="
          clang --version 2>&1 | head -3
          echo ""
          echo "=== hwid.ko ==="
          file drivers/misc/hwid/hwid.ko 2>/dev/null || echo "hwid.ko 未生成"
          echo ""
          echo "=== bq28z610.ko ==="
          file drivers/power/supply/bq28z610.ko 2>/dev/null || echo "bq28z610.ko 未生成"
          echo ""
          echo "=== vermagic ==="
          strings drivers/power/supply/bq28z610.ko 2>/dev/null | grep vermagic
          echo ""
          echo "=== CRC 表 ==="
          aarch64-linux-gnu-readelf -p __versions drivers/power/supply/bq28z610.ko 2>/dev/null | grep -i "get_hw_sku\|module_layout" | head -5
          echo ""
          echo "=== 符号表 (fg_read_ra_table) ==="
          aarch64-linux-gnu-nm --defined-only drivers/power/supply/bq28z610.ko 2>/dev/null | grep -i "ra_table\|fg_read_ra" || echo "(fg_read_ra_table 未找到)"

      - name: Upload bq28z610.ko
        uses: actions/upload-artifact@v4
        with:
          name: bq28z610-xaga
          path: drivers/power/supply/bq28z610.ko

      - name: Upload hwid.ko
        uses: actions/upload-artifact@v4
        with:
          name: hwid-xaga
          path: drivers/misc/hwid/hwid.ko
